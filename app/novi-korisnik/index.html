<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../dist/novi-korisnik/novi-korisnik.css" />
    <title>Korisnici</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../korisnici/">Korisnici</a>
        <a href="../grupe/">Grupe</a>
      </nav>
    </header>
    <section class="addForm">
      <form action="">
        <div>
          <label for="korisnickoIme">Korisničko ime</label>

          <input
            id="korisnickoIme"
            name="korisnickoIme"
            placeholder="pera123"
            type="text"
          />
        </div>
        <div>
          <label for="ime">Ime</label>
          <input id="ime" name="ime" type="text" placeholder="Pera" />
        </div>
        <div>
          <label for="prezime">Prezime</label>
          <input id="prezime" name="prezime" type="text" placeholder="Peric" />
        </div>
        <div>
          <label for="datumRodjenja">Datum rodjenja</label>
          <input id="datumRodjenja" name="datumRodjenja" type="date" />
        </div>
        <button id="submitBtn">Submit</button>
      </form>
    </section>

    <script src="./novi-korisnik.js"></script>
  </body>
</html>
